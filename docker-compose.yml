# Спринт 2: связка C++ сервис + PostgreSQL.
# app хранит состояние в Postgres (DATABASE_URL, хост db).
# ./data:/app/data оставлен как seed для первого старта.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      WEB_ROOT: /app/web
      DATABASE_URL: "postgresql://roadmap:roadmap_pw_change_me@db:5432/roadmap?connect_timeout=5"
    volumes:
      # JSON-хранилище живет на хосте, переживает пересборку образа.
      - ./data:/app/data
      # Медиа-директория хоста для image compare (сканирование/удаление).
      - /mnt/win-data/Media/Pics:/mnt/win-data/Media/Pics
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap_pw_change_me
      POSTGRES_DB: roadmap
    volumes:
      # Данные БД. На Kubena замени на bind к диску:
      - /mnt/k8s-storage/pgdata:/var/lib/postgresql/data
      # - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap -d roadmap"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
