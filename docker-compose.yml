# Спринт 2: связка C++ сервис + PostgreSQL.
# app пока хранит состояние в JSON (./data -> /app/data),
# postgres поднимаем заранее — драйвер подключим следом.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      WEB_ROOT: /app/web
      ROADMAP_FILE: /app/data/roadmap.json
    volumes:
      # JSON-хранилище живет на хосте, переживает пересборку образа.
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap_pw_change_me
      POSTGRES_DB: roadmap
    volumes:
      # Данные БД. На Kubena замени на bind к диску:
      - /mnt/k8s-storage/pgdata:/var/lib/postgresql/data
      # - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap -d roadmap"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
